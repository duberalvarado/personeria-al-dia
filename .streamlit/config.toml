# Tema claro fijo para Personería al Día
[theme]
base = "light"
primaryColor = "#174f7a"
backgroundColor = "#f4f7fa"
secondaryBackgroundColor = "#ffffff"
textColor = "#173f61"
font = "sans serif"

[client]
# Oculta el menú de configuración (incluido el selector de tema claro/oscuro)
toolbarMode = "minimal"

[browser]
gatherUsageStats = false

[server]
# Sirve la carpeta ./static en /app/static (imagen de vista previa)
enableStaticServing = true
